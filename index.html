<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Aynim | فروشگاه آنلاین پوشاک</title>
    <!-- Favicon -->
    <link rel="icon" href="assets/images/logo.png">
    <link rel="shortcut icon" href="assets/images/favicon.png" type="image/x-icon">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="container header__top">
      <a href="#" class="header__logo"><img src="assets/images/logo.png" alt="Aynim"></a>

      <form class="search" role="search">
        <input class="search__input" type="search" placeholder="جستجوی محصولات">
        <button class="search__btn" aria-label="جستجو"><img src="assets/icons/search.svg" alt=""></button>
      </form>

      <div class="header__actions">
        <button class="icon-btn" aria-label="علاقه‌مندی‌ها">
          <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.800-8 11-8 11z"/></svg>
        </button>
        <a href="#" class="btn btn--primary btn--sm"><img src="assets/icons/account.svg" alt="">ورود / ثبت نام</a>
        <a href="#" class="cart" aria-label="سبد خرید"><img src="assets/icons/shop.svg" alt=""><span class="cart__count">۱</span></a>
      </div>
    </div>

    <nav class="container nav">
      <a href="#" class="btn btn--primary">دسته بندی محصولات</a>
      <ul class="nav__list">
        <li><a href="#"><img src="assets/icons/home.svg" alt="">صفحه اصلی</a></li>
        <li><a href="#"><img src="assets/icons/shopping-bag.svg" alt="">فروشگاه</a></li>
        <li><a href="#"><img src="assets/icons/blog.svg" alt="">بلاگ</a></li>
        <li><a href="#"><img src="assets/icons/message-chat.svg" alt="">سوالات متداول</a></li>
      </ul>
      <a href="#" class="btn btn--dark btn--sm"><img src="assets/icons/notification.svg" alt="">همکاری در فروش</a>
    </nav>
  </header>
  
</body>
</html>
